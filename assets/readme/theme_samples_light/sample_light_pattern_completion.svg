<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Light Theme Pattern Completion Sample</title>
  <desc id="desc">Premium light graph UI showing seed entities, spreading signal, and top connected memories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FCFF"/>
      <stop offset="100%" stop-color="#EEF5FF"/>
    </linearGradient>
    <linearGradient id="primaryFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5A0"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B0F19" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="64" y="64" width="952" height="952" rx="28" fill="#FFFFFF" stroke="#DDE7F7" filter="url(#softShadow)"/>

  <text x="112" y="144" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">
    Personalized PageRank Pattern Completion
  </text>
  <text x="112" y="184" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">
    Seed entities activate neighborhoods, then top-ranked memory nodes are surfaced.
  </text>

  <g stroke="url(#primaryFlow)" stroke-linecap="round" fill="none">
    <path d="M270 430 C370 360, 520 330, 650 350" stroke-width="6"/>
    <path d="M270 430 C430 500, 560 540, 705 565" stroke-width="5.5"/>
    <path d="M335 625 C460 605, 590 585, 705 565" stroke-width="5"/>
    <path d="M455 505 C570 485, 680 450, 780 420" stroke-width="5.5"/>
    <path d="M650 350 C760 380, 810 420, 860 500" stroke-width="4.5"/>
    <path d="M705 565 C785 615, 835 655, 870 720" stroke-width="4.5"/>
  </g>

  <g>
    <circle cx="270" cy="430" r="22" fill="#0EA5A0"/>
    <circle cx="335" cy="625" r="22" fill="#0EA5A0"/>
    <circle cx="455" cy="505" r="22" fill="#0EA5A0"/>
    <circle cx="650" cy="350" r="18" fill="#F59E0B"/>
    <circle cx="705" cy="565" r="20" fill="#F59E0B"/>
    <circle cx="780" cy="420" r="18" fill="#F59E0B"/>
    <circle cx="860" cy="500" r="18" fill="#C6D1E5"/>
    <circle cx="870" cy="720" r="18" fill="#C6D1E5"/>
  </g>

  <g fill="none" stroke="#0EA5A0">
    <circle cx="270" cy="430" r="36" stroke-width="3"/>
    <circle cx="335" cy="625" r="36" stroke-width="3"/>
    <circle cx="455" cy="505" r="36" stroke-width="3"/>
  </g>

  <text x="228" y="475" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">SEED</text>
  <text x="294" y="669" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">SEED</text>
  <text x="413" y="549" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">SEED</text>

  <rect x="628" y="768" width="320" height="176" rx="20" fill="#F8FBFF" stroke="#BFD0EE" stroke-width="2"/>
  <text x="656" y="808" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">
    Top connected memories
  </text>
  <rect x="656" y="830" width="258" height="32" rx="10" fill="#E7EFFC"/>
  <rect x="656" y="870" width="232" height="32" rx="10" fill="#E7EFFC"/>
  <rect x="656" y="910" width="208" height="32" rx="10" fill="#E7EFFC"/>

  <g stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M780 420 C840 520, 862 620, 870 768"/>
    <path d="M705 565 C770 650, 795 720, 810 768"/>
  </g>
</svg>
