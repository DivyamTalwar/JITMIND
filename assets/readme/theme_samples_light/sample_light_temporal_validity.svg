<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Light Theme Temporal Validity Sample</title>
  <desc id="desc">Premium light infographic showing t_valid, t_invalid, now line, and stale fact filtering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FCFF"/>
      <stop offset="100%" stop-color="#EEF5FF"/>
    </linearGradient>
    <linearGradient id="activeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5A0"/>
      <stop offset="100%" stop-color="#67D8D2"/>
    </linearGradient>
    <linearGradient id="staleEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#BFC9DA"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B0F19" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="64" y="64" width="952" height="952" rx="28" fill="#FFFFFF" stroke="#DDE7F7" filter="url(#softShadow)"/>

  <text x="112" y="144" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">
    Bi-temporal Validity Filtering
  </text>
  <text x="112" y="184" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">
    History stays, stale facts are filtered from active retrieval context.
  </text>

  <rect x="132" y="300" width="816" height="420" rx="20" fill="#F8FBFF" stroke="#C8D8F2"/>

  <line x1="210" y1="520" x2="640" y2="520" stroke="url(#activeEdge)" stroke-width="11" stroke-linecap="round"/>
  <line x1="640" y1="520" x2="880" y2="520" stroke="url(#staleEdge)" stroke-width="11" stroke-linecap="round"/>

  <circle cx="330" cy="520" r="16" fill="#0EA5A0"/>
  <circle cx="640" cy="520" r="16" fill="#F59E0B"/>
  <circle cx="880" cy="520" r="16" fill="#B6C3DA"/>

  <line x1="330" y1="420" x2="330" y2="640" stroke="#0EA5A0" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="640" y1="420" x2="640" y2="640" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="790" y1="360" x2="790" y2="700" stroke="#0B0F19" stroke-width="4"/>

  <text x="286" y="402" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">t_valid</text>
  <text x="586" y="402" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">t_invalid</text>
  <text x="758" y="338" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">now</text>

  <rect x="132" y="760" width="816" height="184" rx="20" fill="#FFFFFF" stroke="#C8D8F2"/>
  <text x="168" y="808" fill="#0B0F19" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">
    Fact lifecycle semantics
  </text>
  <text x="168" y="848" fill="#1E293B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">
    • Active window: valid for retrieval and reasoning.
  </text>
  <text x="168" y="882" fill="#1E293B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">
    • Post-invalid window: retained for provenance, excluded from active memory context.
  </text>

  <rect x="170" y="470" width="38" height="100" rx="10" fill="#D7E3F7"/>
  <rect x="882" y="470" width="38" height="100" rx="10" fill="#D7E3F7"/>
  <text x="156" y="450" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Entity A</text>
  <text x="862" y="450" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Entity B</text>
</svg>
