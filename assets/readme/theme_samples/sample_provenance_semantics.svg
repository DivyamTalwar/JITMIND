<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Provenance Semantics Theme Sample</title>
  <desc id="desc">Dark premium provenance graph with UPDATES, EXTENDS, and DERIVES relationships.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090F1F"/>
      <stop offset="100%" stop-color="#141B31"/>
    </linearGradient>
    <linearGradient id="tealEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ED3C6"/>
      <stop offset="100%" stop-color="#7FF8EE"/>
    </linearGradient>
    <linearGradient id="amberEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB34D"/>
      <stop offset="100%" stop-color="#FFD8A8"/>
    </linearGradient>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2ED3C6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#FFB34D"/>
    </marker>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="72" y="72" width="936" height="936" rx="30" fill="#111935" stroke="#2A355C"/>

  <text x="116" y="146" fill="#EAF1FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">
    Provenance and Relationship Semantics
  </text>
  <text x="116" y="186" fill="#94A3C4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
    Explicit lineage preserves reasoning traceability and memory auditability.
  </text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="150" y="420" width="220" height="100" rx="18" fill="#243055" stroke="#4D5F93"/>
    <text x="188" y="480" fill="#EAF1FF" font-size="24" font-weight="700">old memory</text>

    <rect x="470" y="280" width="220" height="100" rx="18" fill="#1E3158" stroke="#2ED3C6"/>
    <text x="506" y="340" fill="#EAF1FF" font-size="24" font-weight="700">new memory</text>

    <rect x="470" y="560" width="220" height="100" rx="18" fill="#1E3158" stroke="#FFB34D"/>
    <text x="486" y="620" fill="#EAF1FF" font-size="24" font-weight="700">summary memory</text>

    <rect x="820" y="370" width="160" height="76" rx="14" fill="#243055" stroke="#4D5F93"/>
    <text x="838" y="417" fill="#EAF1FF" font-size="20" font-weight="700">source A</text>

    <rect x="820" y="500" width="160" height="76" rx="14" fill="#243055" stroke="#4D5F93"/>
    <text x="838" y="547" fill="#EAF1FF" font-size="20" font-weight="700">source B</text>
  </g>

  <path d="M370 470 C420 470, 430 400, 470 330" stroke="url(#tealEdge)" stroke-width="5" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="390" y="400" fill="#9FFAF2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">UPDATES</text>

  <path d="M370 470 C430 500, 430 560, 470 610" stroke="url(#amberEdge)" stroke-width="5" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="385" y="550" fill="#FFD7A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">EXTENDS</text>

  <path d="M690 330 C760 350, 780 370, 820 408" stroke="url(#tealEdge)" stroke-width="4.5" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M690 610 C760 580, 780 560, 820 538" stroke="url(#amberEdge)" stroke-width="4.5" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="706" y="472" fill="#C9D7F5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">DERIVES</text>

  <rect x="150" y="760" width="830" height="160" rx="18" fill="#192446" stroke="#32467A"/>
  <text x="186" y="808" fill="#EAF1FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">
    Semantics encoded in edges
  </text>
  <text x="186" y="846" fill="#B8C4E0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
    UPDATES: supersedes prior statement with newer context.
  </text>
  <text x="186" y="878" fill="#B8C4E0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
    EXTENDS: augments existing memory without invalidation. DERIVES: summary lineage from sources.
  </text>
</svg>
